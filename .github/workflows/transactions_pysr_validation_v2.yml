name: transactions-pysr-validation-v2

on:
  pull_request:
    paths:
      - src/fedfalsify/transactions_pysr_validation.py
      - src/fedfalsify/transactions_pysr_validation_fixed.py
      - src/fedfalsify/transactions_pysr.py
      - src/fedfalsify/pysr_adapter.py
      - tests/test_transactions_pysr_validation.py
      - tests/test_transactions_pysr_validation_fixed.py
      - research/TRANSACTIONS_PYSR_VALIDATION_PROTOCOL.md
      - pyproject.toml
      - .github/workflows/transactions_pysr_validation_v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-seed:
    name: validation-v2-seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [10501, 10502, 10503, 10504, 10505]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Install official PySR and test dependencies
        run: python -m pip install -e ".[dev,sr]"
      - name: Validate runner and failure-retention governance
        run: |
          pytest \
            tests/test_transactions_pysr.py \
            tests/test_transactions_pysr_validation.py \
            tests/test_transactions_pysr_validation_fixed.py
      - name: Record environment
        run: |
          python - <<'PY'
          import platform
          import pysr
          print("Python:", platform.python_version())
          print("PySR:", pysr.__version__)
          PY
          julia --version
      - name: Unmeasured Julia and PySR warm-up
        run: |
          mkdir -p /tmp/fedfalsify-pysr-warmup
          fedfalsify-pysr \
            --benchmark base \
            --scenarios complementary \
            --seed 10499 \
            --smoke \
            --output /tmp/fedfalsify-pysr-warmup/rows.csv
      - name: Run frozen matched validation seed
        run: |
          root="results/transactions_pysr_validation_v2/seed-${{ matrix.seed }}"
          rm -rf "$root"
          mkdir -p "$root"
          fedfalsify-transactions-pysr-validation run-seed \
            --seed "${{ matrix.seed }}" \
            --benchmarks base,poly3,nested_sine,trig_product,interaction \
            --scenarios complementary,spurious \
            --noise 0.03,0.10 \
            --samples 300 \
            --clients 4 \
            --regimes compact,quality \
            --output "$root/rows.csv" \
            --manifest "$root/environment.json"
      - name: Validate and retain seed evidence
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          seed = ${{ matrix.seed }}
          root = Path(f"results/transactions_pysr_validation_v2/seed-{seed}")
          with (root / "rows.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 80
          assert {int(row["seed"]) for row in rows} == {seed}
          assert {row["regime"] for row in rows} == {"compact", "quality"}
          assert {row["method"] for row in rows} == {
              "fedfalsify-v05", "official-pysr"
          }
          identities = {
              (
                  row["benchmark"], row["scenario"], row["noise_ratio"],
                  row["samples_per_client"], row["num_clients"],
                  row["seed"], row["regime"], row["method"],
              )
              for row in rows
          }
          assert len(identities) == 80
          pysr_rows = [row for row in rows if row["method"] == "official-pysr"]
          assert len(pysr_rows) == 40
          assert all(row["grammar_supported"] == "True" for row in pysr_rows)
          incomplete = [row for row in pysr_rows if row["completed"] != "True"]
          print(f"Retained incomplete PySR rows for seed {seed}: {len(incomplete)}")
          for row in incomplete:
              print(
                  row["benchmark"], row["scenario"], row["noise_ratio"],
                  row["regime"], row["note"],
              )
              assert row["semantic_all_1e3"] == "0.0"
          manifest = json.loads((root / "environment.json").read_text(encoding="utf-8"))
          assert manifest["seed"] == seed
          assert manifest["status"] == "seed-complete"
          assert manifest["pysr"] != "unavailable"
          assert manifest["julia"] != "unavailable"
          manifest["rows"] = 80
          manifest["pysr_rows"] = 40
          manifest["pysr_completed_rows"] = 40 - len(incomplete)
          manifest["pysr_failed_or_incomplete_rows"] = len(incomplete)
          (root / "environment.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY
      - name: Upload complete seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: pysr-validation-v2-seed-${{ matrix.seed }}
          path: results/transactions_pysr_validation_v2/seed-${{ matrix.seed }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-validation-v2
    runs-on: ubuntu-latest
    needs: run-seed
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: pysr-validation-v2-seed-*
          path: artifacts
      - name: Aggregate frozen paired validation
        run: |
          rm -rf results/transactions_pysr_validation_v2/final
          mkdir -p results/transactions_pysr_validation_v2/final
          mapfile -t files < <(find artifacts -type f -name rows.csv | sort)
          test "${#files[@]}" -eq 5
          fedfalsify-transactions-pysr-validation aggregate \
            --inputs "${files[@]}" \
            --output results/transactions_pysr_validation_v2/final/rows.csv \
            --summary results/transactions_pysr_validation_v2/final/summary.json
          mkdir -p results/transactions_pysr_validation_v2/final/environments
          while IFS= read -r file; do
            seed_name="$(basename "$(dirname "$file")")"
            cp "$file" "results/transactions_pysr_validation_v2/final/environments/${seed_name}.json"
          done < <(find artifacts -type f -name environment.json | sort)
          test "$(find results/transactions_pysr_validation_v2/final/environments -name '*.json' | wc -l)" -eq 5
      - name: Validate complete failure-retaining matrix
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("results/transactions_pysr_validation_v2/final")
          with (root / "rows.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 400
          assert {int(row["seed"]) for row in rows} == set(range(10501, 10506))
          assert not ({int(row["seed"]) for row in rows} & set(range(9001, 9021)))
          assert all(int(row["seed"]) < 11001 for row in rows)
          assert {row["benchmark"] for row in rows} == {
              "base", "poly3", "nested_sine", "trig_product", "interaction"
          }
          assert {row["scenario"] for row in rows} == {
              "complementary", "spurious"
          }
          assert {float(row["noise_ratio"]) for row in rows} == {0.03, 0.10}
          assert {row["regime"] for row in rows} == {"compact", "quality"}
          assert {row["method"] for row in rows} == {
              "fedfalsify-v05", "official-pysr"
          }
          identities = {
              (
                  row["benchmark"], row["scenario"], row["noise_ratio"],
                  row["samples_per_client"], row["num_clients"], row["seed"],
                  row["regime"], row["method"],
              )
              for row in rows
          }
          assert len(identities) == 400
          pysr_rows = [row for row in rows if row["method"] == "official-pysr"]
          assert len(pysr_rows) == 200
          incomplete = [row for row in pysr_rows if row["completed"] != "True"]
          assert all(row["semantic_all_1e3"] == "0.0" for row in incomplete)
          print("Retained incomplete official PySR rows:", len(incomplete))

          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == 2
          assert summary["status"] == "validation"
          assert summary["rows"] == 400
          assert summary["pairs"] == 200
          assert summary["seeds"] == list(range(10501, 10506))
          assert summary["primary_endpoint"].startswith("quality-regime")
          assert summary["paired"]["quality"]["pairs"] == 100
          assert summary["paired"]["compact"]["pairs"] == 100
          assert summary["protocol"]["final_confirmation_start"] == 11001
          assert (
              summary["methods"]["quality:official-pysr"]["failed_or_incomplete"]
              == sum(
                  row["regime"] == "quality" for row in incomplete
              )
          )
          PY
      - name: Seal validation evidence
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import subprocess

          root = Path("results/transactions_pysr_validation_v2/final")

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          with (root / "rows.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          pysr_rows = [row for row in rows if row["method"] == "official-pysr"]
          incomplete = [row for row in pysr_rows if row["completed"] != "True"]
          files = {
              path.relative_to(root).as_posix(): {
                  "bytes": path.stat().st_size,
                  "sha256": digest(path),
              }
              for path in sorted(root.rglob("*"))
              if path.is_file() and path.name != "manifest.json"
          }
          manifest = {
              "schema_version": 2,
              "status": "validation-complete",
              "study": "Matched FedFalsify versus official PySR validation",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_git_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "rows": 400,
              "matched_pairs": 200,
              "official_pysr_rows": 200,
              "official_pysr_completed_rows": 200 - len(incomplete),
              "official_pysr_failed_or_incomplete_rows": len(incomplete),
              "seeds": list(range(10501, 10506)),
              "final_confirmation_seeds_touched": False,
              "primary_endpoint": "quality all-domain semantic recovery at 1e-3",
              "files": files,
              "scientific_boundary": [
                  "Validation evidence, not final confirmation.",
                  "Incomplete PySR equations are retained as binary failures.",
                  "Continuous metrics use only finite matched pairs with counts.",
                  "PySR pools raw observations; FedFalsify does not.",
                  "Exception scenarios are outside the shared grammar.",
                  "Seeds 11001 and above remain untouched."
              ],
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY
      - name: Upload complete validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: transactions-pysr-validation-v2-final
          path: results/transactions_pysr_validation_v2/final
          if-no-files-found: error
          retention-days: 90
