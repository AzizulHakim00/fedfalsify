name: transactions-pysr-calibration

on:
  pull_request:
    paths:
      - src/fedfalsify/transactions_pysr.py
      - tests/test_transactions_pysr.py
      - pyproject.toml
      - .github/workflows/transactions_pysr_calibration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-pysr-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Install official PySR
        run: python -m pip install -e ".[dev,sr]"
      - name: Test PySR comparison governance
        run: pytest tests/test_transactions_pysr.py
      - name: Record package versions
        run: |
          python - <<'PY'
          import platform
          import pysr
          print("Python:", platform.python_version())
          print("PySR:", pysr.__version__)
          PY
          julia --version
      - name: Run official PySR calibration matrix
        run: |
          rm -rf results/transactions_pysr_calibration
          mkdir -p results/transactions_pysr_calibration
          fedfalsify-transactions-pysr \
            --benchmarks base,poly3 \
            --scenarios complementary,spurious \
            --noise 0.03,0.10 \
            --samples 300 \
            --clients 4 \
            --seeds 10001 \
            --niterations 20 \
            --populations 4 \
            --population-size 30 \
            --maxsize 18 \
            --semantic-samples 1000 \
            --output results/transactions_pysr_calibration/rows.csv \
            --manifest results/transactions_pysr_calibration/manifest.json
      - name: Validate calibration evidence
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("results/transactions_pysr_calibration")
          with (root / "rows.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 8
          assert {int(row["seed"]) for row in rows} == {10001}
          assert all(row["grammar_supported"] == "True" for row in rows)
          assert all(row["package_available"] == "True" for row in rows)
          assert all(row["completed"] == "True" for row in rows)
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["status"] == "completed"
          assert manifest["supported_rows"] == 8
          assert manifest["completed_supported_rows"] == 8
          PY
      - name: Seal calibration files
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import subprocess

          root = Path("results/transactions_pysr_calibration")

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update(
              {
                  "sealed_at_utc": datetime.now(timezone.utc).isoformat(),
                  "source_git_commit": subprocess.check_output(
                      ["git", "rev-parse", "HEAD"], text=True
                  ).strip(),
                  "files": {
                      "rows.csv": {
                          "bytes": (root / "rows.csv").stat().st_size,
                          "sha256": digest(root / "rows.csv"),
                      }
                  },
                  "scientific_role": "development budget calibration only",
              }
          )
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY
      - name: Upload official PySR calibration
        uses: actions/upload-artifact@v4
        with:
          name: transactions-pysr-calibration
          path: results/transactions_pysr_calibration
          if-no-files-found: error
          retention-days: 90
