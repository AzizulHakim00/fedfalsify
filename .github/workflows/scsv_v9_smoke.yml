name: SCSV-RCEF v9 engineering smoke

on:
  push:
    branches:
      - feat/fedfalsify-mvi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scsv-rcef-v9-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[run-v9-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source pin
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify frozen historical boundary
        run: |
          set -euo pipefail
          V8_SEAL=a80477308f84c93e02108ff0e9528613f9561f90
          test "$(git rev-parse "${V8_SEAL}:results/scsv_v8/decision.json")" = "$(git rev-parse "HEAD:results/scsv_v8/decision.json")"
          test "$(git rev-parse "${V8_SEAL}:results/scsv_v8/rows.csv")" = "$(git rev-parse "HEAD:results/scsv_v8/rows.csv")"
          grep -q '"status": "DEVELOPMENT-NO-GO"' results/scsv_v8/decision.json
          grep -q '"status": "DEVELOPMENT-NO-GO"' results/scsv_v7/decision.json
          grep -q '"status": "INDEPENDENT-NO-GO"' results/scsv_v6_independent/decision.json
          echo "Historical v6/v7/v8 boundary PASS"

      - name: Run v9 scientific invariant and forced-path tests
        run: pytest -q tests/test_scsv_v9.py

      - name: Run engineering smoke only
        run: |
          rm -rf results/scsv_v9_smoke
          python -m fedfalsify.scsv_v9_study --mode smoke --out results/scsv_v9_smoke

      - name: Audit smoke isolation
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('results/scsv_v9_smoke')
          rows = list(csv.DictReader((root / 'rows.csv').open(encoding='utf-8')))
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          assert len(rows) == 48, len(rows)
          assert summary['status'] == 'scsv-rcef-v9-engineering-smoke'
          assert summary['conditions'] == 8
          assert summary['seeds'] == [26001]
          assert not (root / 'decision.json').exists()
          assert {int(row['seed']) for row in rows} == {26001}
          assert not {26101,26102,26103,26104,26105} & {int(row['seed']) for row in rows}
          full = [row for row in rows if row['method'] == 'scsv-rcef-v9-full']
          assert len(full) == 8
          for row in full:
              anchor = {x for x in row['anchor_structure'].split(';') if x}
              final = {x for x in row['final_structure'].split(';') if x}
              assert anchor <= final
              assert int(row['role_integrity_violation_count']) == 0
              assert int(row['source_qualification_violation_count']) == 0
              assert int(row['pair_invariant_violation_count']) == 0
              assert int(row['evidence_fusion_violation_count']) == 0
          print('SCSV-RCEF v9 engineering smoke isolation PASS')
          PY

      - name: Upload engineering smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: scsv-rcef-v9-engineering-smoke
          path: results/scsv_v9_smoke
          if-no-files-found: error
          retention-days: 7
