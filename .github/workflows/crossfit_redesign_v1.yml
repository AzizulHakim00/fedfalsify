name: transactions-crossfit-redesign-v1

on:
  pull_request:
    paths:
      - src/fedfalsify/crossfit_redesign.py
      - src/fedfalsify/redesign_study.py
      - src/fedfalsify/redesign_study_fixed.py
      - tests/test_crossfit_redesign.py
      - research/TRANSACTIONS_CROSSFIT_REDESIGN_PROTOCOL.md
      - pyproject.toml
      - .github/workflows/crossfit_redesign_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redesign:
    name: crossfit-redesign-development-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate leakage and fallback safeguards
        run: pytest tests/test_crossfit_redesign.py
      - name: Run redesign smoke matrix
        run: |
          rm -rf /tmp/crossfit-redesign-smoke
          fedfalsify-crossfit-redesign \
            --smoke \
            --output /tmp/crossfit-redesign-smoke/rows.csv \
            --summary /tmp/crossfit-redesign-smoke/summary.json
      - name: Validate smoke evidence
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('/tmp/crossfit-redesign-smoke')
          rows = list(csv.DictReader((root / 'rows.csv').open(newline='', encoding='utf-8')))
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          assert len(rows) == 20
          assert summary['schema_version'] == 2
          assert summary['conditions'] == 4
          assert set(summary['methods']) == {
              'legacy-certificate',
              'crossfit-intersection',
              'crossfit-governed',
              'score-only-federated',
              'centralized-forward',
          }
          PY
      - name: Run frozen complete redesign matrix
        run: |
          rm -rf results/crossfit_redesign_v1
          fedfalsify-crossfit-redesign \
            --output results/crossfit_redesign_v1/rows.csv \
            --summary results/crossfit_redesign_v1/summary.json
      - name: Validate complete matched evidence
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path

          root = Path('results/crossfit_redesign_v1')
          rows = list(csv.DictReader((root / 'rows.csv').open(newline='', encoding='utf-8')))
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          expected_methods = {
              'legacy-certificate',
              'crossfit-intersection',
              'crossfit-governed',
              'score-only-federated',
              'centralized-forward',
          }
          expected_benchmarks = {
              'base', 'poly3', 'nested_sine', 'trig_product', 'interaction'
          }
          expected_scenarios = {'complementary', 'spurious', 'exception'}
          expected_noise = {0.03, 0.10, 0.20}
          expected_samples = {120, 300}
          expected_seeds = set(range(13001, 13006))

          assert summary['schema_version'] == 2
          assert summary['status'] == 'development-redesign'
          assert summary['conditions'] == 450
          assert summary['rows'] == 2250
          assert len(rows) == 2250
          assert set(summary['methods']) == expected_methods
          assert {row['method'] for row in rows} == expected_methods
          assert {row['benchmark'] for row in rows} == expected_benchmarks
          assert {row['scenario'] for row in rows} == expected_scenarios
          assert {float(row['noise_ratio']) for row in rows} == expected_noise
          assert {int(row['samples_per_client']) for row in rows} == expected_samples
          assert {int(row['seed']) for row in rows} == expected_seeds

          identities = {
              (
                  row['benchmark'], row['scenario'], float(row['noise_ratio']),
                  int(row['samples_per_client']), int(row['num_clients']),
                  int(row['seed']), row['method'],
              )
              for row in rows
          }
          assert len(identities) == 2250
          numeric_fields = [
              'exact_recovery', 'term_precision', 'term_recall', 'test_nmse',
              'train_mse', 'spurious_accepted', 'exception_recovered',
              'fallback_selected', 'runtime_seconds', 'communication_bytes',
          ]
          for row in rows:
              for field in numeric_fields:
                  value = float(row[field])
                  assert math.isfinite(value)
                  assert value >= 0
              if row['method'].startswith('crossfit'):
                  assert row['validation_mse'] != ''
                  assert row['worst_validation_mse'] != ''
                  assert math.isfinite(float(row['validation_mse']))
                  assert math.isfinite(float(row['worst_validation_mse']))
          assert set(summary['development_gate']['criteria']) == {
              'overall_exact_noninferiority',
              'mean_test_nmse_improves',
              'spurious_acceptance_controlled',
              'high_noise_poly_interaction_exact_gain',
              'fallback_not_disproportionate_on_spurious',
          }
          PY
      - name: Seal redesign evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import platform
          import subprocess

          root = Path('results/crossfit_redesign_v1')
          source_paths = [
              Path('src/fedfalsify/crossfit_redesign.py'),
              Path('src/fedfalsify/redesign_study.py'),
              Path('src/fedfalsify/redesign_study_fixed.py'),
              Path('tests/test_crossfit_redesign.py'),
              Path('research/TRANSACTIONS_CROSSFIT_REDESIGN_PROTOCOL.md'),
              Path('pyproject.toml'),
          ]

          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      value.update(block)
              return value.hexdigest()

          files = {
              path.name: {'bytes': path.stat().st_size, 'sha256': digest(path)}
              for path in sorted(root.iterdir()) if path.is_file()
          }
          source_files = {
              path.as_posix(): {'bytes': path.stat().st_size, 'sha256': digest(path)}
              for path in source_paths
          }
          manifest = {
              'schema_version': 1,
              'status': 'development-redesign-complete',
              'study': 'Cross-fitted certificate and governed continuation development matrix',
              'created_at_utc': datetime.now(timezone.utc).isoformat(),
              'source_git_commit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'python': platform.python_version(),
              'conditions': 450,
              'rows': 2250,
              'development_seeds': list(range(13001, 13006)),
              'final_confirmation_seeds_used': False,
              'external_artifacts_modified': False,
              'negative_results_retained': True,
              'files': files,
              'source_files': source_files,
          }
          (root / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crossfit-redesign-v1
          path: results/crossfit_redesign_v1
          if-no-files-found: error
          retention-days: 90
