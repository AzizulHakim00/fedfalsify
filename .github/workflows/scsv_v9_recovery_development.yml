name: SCSV-RCEF v9 sharded fresh recovery evidence

on:
  push:
    branches:
      - feat/fedfalsify-mvi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scsv-rcef-v9-recovery-development
  cancel-in-progress: false

jobs:
  shard:
    if: contains(github.event.head_commit.message, '[run-v9-recovery-development]')
    strategy:
      fail-fast: false
      matrix:
        seed: [27101, 27102, 27103, 27104, 27105]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source pin
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify frozen v9 source and recovery boundary
        run: |
          set -euo pipefail
          FROZEN_V9=f291f05f1c0f0916b4450e9dcc8bbec4322bb110
          V8_SEAL=a80477308f84c93e02108ff0e9528613f9561f90
          for path in \
            research/TRANSACTIONS_SCSV_RCEF_V9_PROTOCOL.md \
            src/fedfalsify/scsv_v9.py \
            src/fedfalsify/scsv_v9_benchmarks.py \
            src/fedfalsify/scsv_v9_study.py \
            tests/test_scsv_v9.py; do
            test "$(git rev-parse "${FROZEN_V9}:${path}")" = "$(git rev-parse "HEAD:${path}")"
          done
          test "$(git rev-parse "${V8_SEAL}:results/scsv_v8/decision.json")" = "$(git rev-parse "HEAD:results/scsv_v8/decision.json")"
          test "$(git rev-parse "${V8_SEAL}:results/scsv_v8/rows.csv")" = "$(git rev-parse "HEAD:results/scsv_v8/rows.csv")"
          grep -q 'INFRASTRUCTURE-CANCELLED / NO SCIENTIFIC VERDICT' research/TRANSACTIONS_SCSV_RCEF_V9_INFRASTRUCTURE_CANCELLATION.md
          pytest -q tests/test_scsv_v9.py tests/test_scsv_v9_recovery.py

      - name: Execute one frozen 120-condition recovery shard
        run: |
          rm -rf "results/scsv_v9_recovery_shard_${{ matrix.seed }}"
          python -m fedfalsify.scsv_v9_recovery shard \
            --seed "${{ matrix.seed }}" \
            --out "results/scsv_v9_recovery_shard_${{ matrix.seed }}"

      - name: Audit shard isolation
        run: |
          SEED="${{ matrix.seed }}" python - <<'PY'
          import csv, json, os
          from pathlib import Path

          seed = int(os.environ['SEED'])
          root = Path(f'results/scsv_v9_recovery_shard_{seed}')
          rows = list(csv.DictReader((root / f'rows-{seed}.csv').open(encoding='utf-8')))
          manifest = json.loads((root / f'manifest-{seed}.json').read_text(encoding='utf-8'))
          assert len(rows) == 720, len(rows)
          assert {int(row['seed']) for row in rows} == {seed}
          methods = {
              'scsv-rcef-v9-full',
              'scsv-rcef-v9-no-role-proposer',
              'scsv-rcef-v9-selector-only',
              'scsv-spcc-v8-style',
              'scsv-v6-anchor',
              'centralized-forward',
          }
          assert {row['method'] for row in rows} == methods
          keys = {
              (row['family'], row['noise_ratio'], row['samples_per_client'], row['num_clients'], row['balance_profile'], row['role_profile'], row['seed'])
              for row in rows
          }
          assert len(keys) == 120, len(keys)
          assert manifest['seed'] == seed
          assert manifest['conditions'] == 120
          assert manifest['rows'] == 720
          assert manifest['scientific_interpretation'] == 'NONE-PARTIAL-SHARD'
          print(f'Shard {seed} isolation PASS')
          PY

      - name: Upload raw recovery shard
        uses: actions/upload-artifact@v4
        with:
          name: scsv-rcef-v9-recovery-shard-${{ matrix.seed }}
          path: results/scsv_v9_recovery_shard_${{ matrix.seed }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: contains(github.event.head_commit.message, '[run-v9-recovery-development]')
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact aggregation source pin
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Download all five raw shards
        uses: actions/download-artifact@v4
        with:
          pattern: scsv-rcef-v9-recovery-shard-*
          path: results/v9_recovery_shards
          merge-multiple: true

      - name: Verify shard completeness before aggregation
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path('results/v9_recovery_shards')
          row_files = sorted(root.glob('rows-27*.csv'))
          manifest_files = sorted(root.glob('manifest-27*.json'))
          assert len(row_files) == 5, [str(p) for p in row_files]
          assert len(manifest_files) == 5, [str(p) for p in manifest_files]
          expected = {27101,27102,27103,27104,27105}
          observed = set()
          total_rows = 0
          all_keys = set()
          all_row_keys = set()
          methods = {
              'scsv-rcef-v9-full',
              'scsv-rcef-v9-no-role-proposer',
              'scsv-rcef-v9-selector-only',
              'scsv-spcc-v8-style',
              'scsv-v6-anchor',
              'centralized-forward',
          }
          for path in row_files:
              rows = list(csv.DictReader(path.open(encoding='utf-8')))
              assert len(rows) == 720, (path, len(rows))
              seeds = {int(row['seed']) for row in rows}
              assert len(seeds) == 1
              seed = next(iter(seeds))
              observed.add(seed)
              total_rows += len(rows)
              condition_keys = {
                  (row['family'], row['noise_ratio'], row['samples_per_client'], row['num_clients'], row['balance_profile'], row['role_profile'], row['seed'])
                  for row in rows
              }
              assert len(condition_keys) == 120
              all_keys |= condition_keys
              for row in rows:
                  key = (
                      row['family'], row['noise_ratio'], row['samples_per_client'], row['num_clients'],
                      row['balance_profile'], row['role_profile'], row['seed'], row['method']
                  )
                  assert key not in all_row_keys, key
                  all_row_keys.add(key)
              for key in condition_keys:
                  matched = {
                      row['method'] for row in rows
                      if (row['family'], row['noise_ratio'], row['samples_per_client'], row['num_clients'], row['balance_profile'], row['role_profile'], row['seed']) == key
                  }
                  assert matched == methods
          assert observed == expected, observed
          assert total_rows == 3600, total_rows
          assert len(all_keys) == 600, len(all_keys)
          assert len(all_row_keys) == 3600, len(all_row_keys)
          assert not ({26001,26101,26102,26103,26104,26105,27001} & observed)
          print('Five-shard pre-aggregation integrity PASS')
          PY

      - name: Combine shards and evaluate frozen A-W gates once
        run: |
          rm -rf results/scsv_v9_recovery
          python -m fedfalsify.scsv_v9_recovery combine \
            --input-root results/v9_recovery_shards \
            --out results/scsv_v9_recovery

      - name: Audit and seal combined recovery evidence
        run: |
          python - <<'PY'
          import csv, hashlib, json, math
          from pathlib import Path

          root = Path('results/scsv_v9_recovery')
          rows = list(csv.DictReader((root / 'rows.csv').open(encoding='utf-8')))
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          decision = json.loads((root / 'decision.json').read_text(encoding='utf-8'))
          assert len(rows) == 3600, len(rows)
          assert {int(row['seed']) for row in rows} == {27101,27102,27103,27104,27105}
          assert summary['conditions'] == 600
          assert summary['rows'] == 3600
          assert summary['seeds'] == [27101,27102,27103,27104,27105]
          assert decision['status'] in {'DEVELOPMENT-GO','DEVELOPMENT-NO-GO'}
          assert decision['passed'] == all(decision['criteria'].values())
          assert len(decision['criteria']) == 23
          assert '27101--27105' in decision['scientific_boundary']

          numeric_fields = [
              'noise_ratio','exact_recovery','term_precision','term_recall','test_nmse','train_mse',
              'deviation_precision','deviation_recall','all_true_deviations_recovered',
              'spurious_deviation_accepted','runtime_seconds','role_hypothesis_positive',
              'source_ambiguity','global_ambiguity'
          ]
          for row in rows:
              for field in numeric_fields:
                  assert math.isfinite(float(row[field])), (field, row[field])

          source_paths = [
              'research/TRANSACTIONS_SCSV_RCEF_V9_PROTOCOL.md',
              'research/TRANSACTIONS_SCSV_RCEF_V9_INFRASTRUCTURE_CANCELLATION.md',
              'research/TRANSACTIONS_SCSV_RCEF_V9_INFRASTRUCTURE_RECOVERY_PROTOCOL.md',
              'src/fedfalsify/scsv_v9.py',
              'src/fedfalsify/scsv_v9_benchmarks.py',
              'src/fedfalsify/scsv_v9_study.py',
              'src/fedfalsify/scsv_v9_recovery.py',
              'tests/test_scsv_v9.py',
              'tests/test_scsv_v9_recovery.py',
              '.github/workflows/scsv_v9_recovery_development.yml',
          ]
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          output_paths = ['rows.csv','summary.json','decision.json']
          manifest = {
              'schema_version': 1,
              'run_mode': 'fresh-scsv-rcef-v9-sharded-infrastructure-recovery',
              'run_commit': '${{ github.sha }}',
              'workflow_run_id': '${{ github.run_id }}',
              'conditions': 600,
              'rows': 3600,
              'engineering_seed_used': [],
              'fresh_recovery_seeds': [27101,27102,27103,27104,27105],
              'spent_cancelled_v9_seeds': [26101,26102,26103,26104,26105],
              'cancelled_v9_run': 31435708338,
              'cancelled_v9_status': 'INFRASTRUCTURE-CANCELLED / NO SCIENTIFIC VERDICT',
              'historical_v6_independent_status': 'INDEPENDENT-NO-GO',
              'historical_v7_status': 'DEVELOPMENT-NO-GO',
              'historical_v8_status': 'DEVELOPMENT-NO-GO',
              'source_sha256': {path: sha(path) for path in source_paths},
              'output_sha256': {name: sha(root / name) for name in output_paths},
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          output_paths.append('manifest.json')
          sums = ''.join(f"{sha(root / name)}  {name}\n" for name in output_paths)
          (root / 'SHA256SUMS').write_text(sums, encoding='utf-8')
          (root / 'COMPLETE').write_text('SCSV-RCEF v9 sharded infrastructure-recovery evidence sealed\n', encoding='utf-8')
          print(json.dumps(decision, indent=2, sort_keys=True))
          PY

      - name: Upload sealed combined recovery evidence before repository write
        uses: actions/upload-artifact@v4
        with:
          name: scsv-rcef-v9-sharded-recovery-evidence
          path: results/scsv_v9_recovery
          if-no-files-found: error
          retention-days: 30

      - name: Commit sealed combined recovery evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/scsv_v9_recovery
          git commit -m "results: seal SCSV-RCEF v9 sharded recovery evidence [skip ci]"
          git push origin HEAD:feat/fedfalsify-mvi
