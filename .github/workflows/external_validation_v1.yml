name: transactions-external-validation-v1

on:
  pull_request:
    paths:
      - src/fedfalsify/external_common.py
      - src/fedfalsify/external_beijing.py
      - src/fedfalsify/external_beijing_fixed.py
      - src/fedfalsify/external_beijing_study.py
      - src/fedfalsify/external_beijing_study_fixed.py
      - src/fedfalsify/external_srsd_study.py
      - src/fedfalsify/external_srsd_study_fixed.py
      - tests/test_external_beijing.py
      - tests/test_external_common.py
      - tests/test_external_studies.py
      - research/TRANSACTIONS_EXTERNAL_VALIDATION_PROTOCOL.md
      - pyproject.toml
      - .github/workflows/external_validation_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beijing:
    name: beijing-12-station-study
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Install external-study dependencies
        run: python -m pip install -e ".[dev,sr]"
      - name: Validate external-study governance
        run: |
          pytest \
            tests/test_external_beijing.py \
            tests/test_external_common.py \
            tests/test_external_studies.py
      - name: Warm up official PySR outside measured study
        run: |
          mkdir -p /tmp/external-pysr-warmup
          fedfalsify-pysr \
            --benchmark base \
            --scenarios complementary \
            --seed 11999 \
            --smoke \
            --output /tmp/external-pysr-warmup/rows.csv
      - name: Run frozen Beijing external validation
        run: |
          rm -rf results/external_beijing_v1 .cache/external_beijing
          mkdir -p results/external_beijing_v1 .cache/external_beijing
          fedfalsify-external-beijing-study \
            --archive .cache/external_beijing/beijing.zip \
            --download \
            --max-train-per-station 2000 \
            --pysr-iterations 20 \
            --output results/external_beijing_v1/rows.csv \
            --summary results/external_beijing_v1/summary.json
      - name: Validate Beijing evidence
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("results/external_beijing_v1")
          rows = list(csv.DictReader((root / "rows.csv").open(newline="", encoding="utf-8")))
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          assert summary["status"] == "external-validation"
          assert summary["dataset_manifest"]["station_count"] == 12
          assert summary["dataset_manifest"]["total_raw_rows"] == 420768
          assert len({row["station"] for row in rows if row["split"] == "test"}) == 12
          methods = {row["method"] for row in rows if row["split"] == "test"}
          assert methods == {
              "fedfalsify",
              "centralized-forward",
              "score-only-federated",
              "pooled-linear-ridge",
              "local-only-forward",
              "official-pysr",
              "pooled-hist-gradient-boosting",
          }
          assert len([row for row in rows if row["split"] == "test"]) == 84
          assert len([row for row in rows if row["split"] == "loso-test"]) == 24
          assert all(float(row["nmse"]) >= 0 for row in rows)
          PY
      - name: Seal Beijing evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import platform
          import subprocess
          import pysr

          root = Path("results/external_beijing_v1")
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()
          files = {
              path.name: {"bytes": path.stat().st_size, "sha256": digest(path)}
              for path in sorted(root.iterdir()) if path.is_file()
          }
          manifest = {
              "schema_version": 1,
              "status": "external-validation-complete",
              "study": "UCI Beijing 12-station PM2.5 association",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_git_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": platform.python_version(),
              "pysr": pysr.__version__,
              "files": files,
              "negative_results_retained": True,
              "causal_claim": False,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: external-beijing-v1
          path: results/external_beijing_v1
          if-no-files-found: error
          retention-days: 90

  srsd:
    name: srsd-five-equation-study
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Install external-study dependencies
        run: python -m pip install -e ".[dev,sr]"
      - name: Validate structure-preserving study code
        run: pytest tests/test_external_common.py tests/test_external_studies.py
      - name: Warm up official PySR outside measured study
        run: |
          mkdir -p /tmp/external-pysr-warmup
          fedfalsify-pysr \
            --benchmark base \
            --scenarios complementary \
            --seed 11998 \
            --smoke \
            --output /tmp/external-pysr-warmup/rows.csv
      - name: Run frozen SRSD external validation
        run: |
          rm -rf results/external_srsd_v1 .cache/srsd-feynman_easy
          fedfalsify-external-srsd-study \
            --cache-dir .cache/srsd-feynman_easy \
            --pysr-iterations 30 \
            --output results/external_srsd_v1/rows.csv \
            --summary results/external_srsd_v1/summary.json
      - name: Validate SRSD evidence
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("results/external_srsd_v1")
          rows = list(csv.DictReader((root / "rows.csv").open(newline="", encoding="utf-8")))
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == 2
          assert summary["status"] == "external-validation"
          assert len(summary["problems"]) == 5
          assert len(rows) == 35
          assert {row["method"] for row in rows} == {
              "fedfalsify", "centralized-forward", "score-only-federated", "official-pysr"
          }
          assert {row["catalog_condition"] for row in rows} == {
              "truth-supported", "catalog-misspecified", "adaptive-search"
          }
          assert all(float(row["test_nmse"]) >= 0 for row in rows)
          assert len(summary["manifests"]) == 5
          PY
      - name: Seal SRSD evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import platform
          import subprocess
          import pysr

          root = Path("results/external_srsd_v1")
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()
          files = {
              path.name: {"bytes": path.stat().st_size, "sha256": digest(path)}
              for path in sorted(root.iterdir()) if path.is_file()
          }
          manifest = {
              "schema_version": 1,
              "status": "external-validation-complete",
              "study": "SRSD-Feynman five-equation external study",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_git_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": platform.python_version(),
              "pysr": pysr.__version__,
              "files": files,
              "negative_results_retained": True,
              "catalog_misspecification_retained": True,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: external-srsd-v1
          path: results/external_srsd_v1
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-external-validation
    runs-on: ubuntu-latest
    needs: [beijing, srsd]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: external-*-v1
          path: external-artifacts
      - name: Create cross-dataset evidence index
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("external-artifacts")
          manifests = list(root.rglob("manifest.json"))
          summaries = list(root.rglob("summary.json"))
          assert len(manifests) == 2
          assert len(summaries) == 2
          def digest(path):
              value = hashlib.sha256(path.read_bytes()).hexdigest()
              return {"path": path.as_posix(), "bytes": path.stat().st_size, "sha256": value}
          index = {
              "schema_version": 1,
              "status": "two-dataset-external-validation-complete",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "studies": [digest(path) for path in sorted(manifests)],
              "summaries": [digest(path) for path in sorted(summaries)],
              "paper_inclusion_decision": "pending scientific inspection",
          }
          output = Path("external-final")
          output.mkdir()
          (output / "index.json").write_text(json.dumps(index, indent=2, sort_keys=True), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: transactions-external-validation-v1-index
          path: external-final
          if-no-files-found: error
          retention-days: 90
