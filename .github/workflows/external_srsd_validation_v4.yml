name: transactions-external-srsd-validation-v4

on:
  pull_request:
    paths:
      - src/fedfalsify/external_common.py
      - src/fedfalsify/external_srsd_study.py
      - src/fedfalsify/external_srsd_study_fixed.py
      - src/fedfalsify/external_srsd_study_v3.py
      - src/fedfalsify/external_srsd_study_v4.py
      - tests/test_external_common.py
      - tests/test_external_studies.py
      - research/TRANSACTIONS_EXTERNAL_VALIDATION_PROTOCOL.md
      - pyproject.toml
      - .github/workflows/external_srsd_validation_v4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  srsd-v4:
    name: unit-invariant-srsd-five-equation-study
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev,sr]"
      - name: Validate scale, truth, and basis governance
        run: pytest tests/test_external_common.py tests/test_external_studies.py
      - name: Warm up official PySR outside measured study
        run: |
          mkdir -p /tmp/external-pysr-warmup
          fedfalsify-pysr \
            --benchmark base \
            --scenarios complementary \
            --seed 11998 \
            --smoke \
            --output /tmp/external-pysr-warmup/rows.csv
      - name: Run unit-invariant frozen SRSD study
        run: |
          rm -rf results/external_srsd_v4 .cache/srsd-feynman_easy
          fedfalsify-external-srsd-study \
            --cache-dir .cache/srsd-feynman_easy \
            --pysr-iterations 30 \
            --output results/external_srsd_v4/rows.csv \
            --summary results/external_srsd_v4/summary.json
      - name: Validate complete failure-retaining evidence
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path

          root = Path("results/external_srsd_v4")
          rows = list(csv.DictReader((root / "rows.csv").open(newline="", encoding="utf-8")))
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          expected_problems = [
              "feynman-i.12.1",
              "feynman-i.14.3",
              "feynman-i.18.12",
              "feynman-ii.15.4",
              "feynman-ii.27.18",
          ]
          assert summary["schema_version"] == 4
          assert summary["status"] == "external-validation"
          assert summary["problems"] == expected_problems
          assert len(rows) == 35
          assert {row["problem"] for row in rows} == set(expected_problems)
          assert {row["method"] for row in rows} == {
              "fedfalsify", "centralized-forward", "score-only-federated", "official-pysr"
          }
          assert {row["catalog_condition"] for row in rows} == {
              "truth-supported", "catalog-misspecified", "adaptive-search"
          }
          assert len({
              (row["problem"], row["method"], row["catalog_condition"])
              for row in rows
          }) == 35
          assert all(
              math.isfinite(float(row["test_nmse"]))
              and float(row["test_nmse"]) >= 0
              for row in rows
          )
          for row in rows:
              if row["expression"].strip() in {"0", "0.0"}:
                  assert float(row["semantic_1e4"]) == 0.0
          supported = [
              row for row in rows
              if row["catalog_condition"] == "truth-supported"
          ]
          assert len(supported) == 15
          assert all(
              float(row["strict_exact_recovery"]) in {0.0, 1.0}
              for row in supported
          )
          assert len(summary["manifests"]) == 5
          for item in summary["manifests"]:
              assert "training clients only" in item["basis_scaling"]
              for condition in ("truth-supported", "catalog-misspecified"):
                  scaling = item["term_scaling"][condition]
                  assert scaling["1"] == {"mean": 0.0, "scale": 1.0}
                  assert all(float(record["scale"]) > 0 for record in scaling.values())
          PY
      - name: Seal final SRSD evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import platform
          import subprocess
          import pysr

          root = Path("results/external_srsd_v4")
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()
          files = {
              path.name: {"bytes": path.stat().st_size, "sha256": digest(path)}
              for path in sorted(root.iterdir()) if path.is_file()
          }
          manifest = {
              "schema_version": 4,
              "status": "external-validation-complete",
              "study": "Final unit-invariant SRSD-Feynman five-equation study",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_git_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": platform.python_version(),
              "pysr": pysr.__version__,
              "rows": 35,
              "problems": 5,
              "files": files,
              "negative_results_retained": True,
              "catalog_misspecification_retained": True,
              "failed_schema_predecessor_run": 30860646170,
              "inadmissible_target_scale_v2_run": 30861162857,
              "unit_sensitive_basis_v3_run": 30861771502,
              "repair_scope": [
                  "training-only normalization of every nonconstant finite basis column",
                  "no change to problem list, clients, methods, PySR budget, or seeds"
              ]
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: external-srsd-v4
          path: results/external_srsd_v4
          if-no-files-found: error
          retention-days: 90
