name: transactions-role-conditional-v4-evidence

on:
  push:
    branches:
      - feat/fedfalsify-mvi

permissions:
  contents: write

concurrency:
  group: role-conditional-v4-evidence
  cancel-in-progress: true

jobs:
  full-study:
    if: contains(github.event.head_commit.message, '[run-v4-full]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source pin
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "Pinned source: ${GITHUB_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify frozen v4 implementation
        run: python -m pytest tests/test_role_conditional_v4.py

      - name: Execute frozen 4,500-row v4 matrix
        run: |
          rm -rf results/role_conditional_v4
          mkdir -p results/role_conditional_v4
          fedfalsify-role-v4-study \
            --output results/role_conditional_v4/rows.csv \
            --summary results/role_conditional_v4/summary.json

      - name: Audit and seal v4 evidence
        env:
          RUN_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import math
          import os
          from collections import Counter
          from pathlib import Path

          root = Path("results/role_conditional_v4")
          rows_path = root / "rows.csv"
          summary_path = root / "summary.json"
          rows = list(csv.DictReader(rows_path.open(encoding="utf-8")))
          summary = json.loads(summary_path.read_text(encoding="utf-8"))

          expected_methods = {
              "legacy-certificate",
              "crossfit-v2-structural",
              "stability-superset-v3",
              "role-v4-full",
              "role-v4-anchor",
              "role-v4-no-role-conditioning",
              "role-v4-no-path-persistence",
              "role-v4-no-backward",
              "centralized-forward",
              "score-only-federated",
          }
          expected_seeds = {16101, 16102, 16103, 16104, 16105}

          if len(rows) != 4500:
              raise RuntimeError(f"expected 4500 rows, found {len(rows)}")
          methods = {row["method"] for row in rows}
          if methods != expected_methods:
              raise RuntimeError(f"method mismatch: {methods}")
          counts = Counter(row["method"] for row in rows)
          if set(counts.values()) != {450}:
              raise RuntimeError(f"unbalanced method rows: {counts}")

          seeds = {int(row["seed"]) for row in rows}
          if seeds != expected_seeds or 16001 in seeds:
              raise RuntimeError(f"v4 evidence seed violation: {seeds}")
          forbidden = set(range(15101, 15106)) | {15001}
          if seeds & forbidden:
              raise RuntimeError(f"v3/smoke seeds entered v4 evidence: {seeds & forbidden}")

          conditions = {
              (
                  row["benchmark"],
                  row["scenario"],
                  row["noise_ratio"],
                  row["samples_per_client"],
                  row["seed"],
              )
              for row in rows
          }
          if len(conditions) != 450:
              raise RuntimeError(f"expected 450 conditions, found {len(conditions)}")
          if summary["rows"] != 4500 or summary["conditions"] != 450:
              raise RuntimeError("summary dimensions do not match retained rows")

          gate = summary["development_gate"]
          if gate["evaluated"] is not True or not isinstance(gate["passed"], bool):
              raise RuntimeError("frozen v4 development gate was not evaluated")

          numeric = (
              "exact_recovery",
              "term_precision",
              "term_recall",
              "test_nmse",
              "train_mse",
              "spurious_accepted",
              "exception_recovered",
              "runtime_seconds",
              "communication_bytes",
          )
          for row in rows:
              for field in numeric:
                  if not math.isfinite(float(row[field])):
                      raise RuntimeError(f"non-finite {field}: {row}")

          decision = {
              "schema_version": 1,
              "status": "GO" if gate["passed"] else "NO-GO",
              "passed": gate["passed"],
              "criteria": gate["criteria"],
              "failed_criteria": [
                  name for name, passed in gate["criteria"].items() if not passed
              ],
              "claim_boundary": gate["scientific_boundary"],
          }
          decision_path = root / "decision.json"
          decision_path.write_text(
              json.dumps(decision, indent=2, sort_keys=True), encoding="utf-8"
          )

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          source_paths = [
              Path(".github/workflows/role_conditional_v4_evidence.yml"),
              Path("research/TRANSACTIONS_ROLE_CONDITIONAL_V4_PROTOCOL.md"),
              Path("research/TRANSACTIONS_ROLE_CONDITIONAL_V4_IMPLEMENTATION_CLARIFICATION.md"),
              Path("src/fedfalsify/basis.py"),
              Path("src/fedfalsify/benchmarks.py"),
              Path("src/fedfalsify/certificate.py"),
              Path("src/fedfalsify/client.py"),
              Path("src/fedfalsify/server.py"),
              Path("src/fedfalsify/baselines.py"),
              Path("src/fedfalsify/redesign_study.py"),
              Path("src/fedfalsify/surrogate_study.py"),
              Path("src/fedfalsify/crossfit_redesign.py"),
              Path("src/fedfalsify/crossfit_surrogate.py"),
              Path("src/fedfalsify/stability_screen.py"),
              Path("src/fedfalsify/stability_superset.py"),
              Path("src/fedfalsify/role_conditional.py"),
              Path("src/fedfalsify/role_conditional_study.py"),
              Path("src/fedfalsify/role_conditional_report.py"),
              Path("tests/test_role_conditional_v4.py"),
              Path("pyproject.toml"),
          ]
          manifest = {
              "schema_version": 1,
              "status": "sealed",
              "run_mode": "primary-v4-development-evidence",
              "run_commit": os.environ["RUN_COMMIT"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "engineering_smoke_seed_excluded": 16001,
              "evidence_seeds": sorted(expected_seeds),
              "rows": len(rows),
              "conditions": len(conditions),
              "source_sha256": {
                  str(path): digest(path) for path in source_paths
              },
              "output_sha256": {
                  "rows.csv": digest(rows_path),
                  "summary.json": digest(summary_path),
                  "decision.json": digest(decision_path),
              },
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8"
          )
          (root / "COMPLETE").write_text("sealed\n", encoding="utf-8")
          print(json.dumps(decision, indent=2, sort_keys=True))
          PY

      - name: Upload sealed v4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: role-conditional-v4-evidence
          path: results/role_conditional_v4
          if-no-files-found: error
          retention-days: 7

      - name: Commit sealed v4 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/role_conditional_v4
          git commit -m "results: seal role-conditioned v4 evidence [skip-v4-full] [skip ci]"
          git fetch origin feat/fedfalsify-mvi
          git rebase origin/feat/fedfalsify-mvi
          git push origin HEAD:feat/fedfalsify-mvi
