name: transactions-ablation-development

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test ablation governance
        run: pytest tests/test_transactions_ablation.py tests/test_transactions_ablation_fixed.py
      - name: Run fresh-seed development ablations
        run: |
          rm -rf results/transactions_ablation_dev
          mkdir -p results/transactions_ablation_dev
          fedfalsify-transactions-ablation \
            --benchmarks base,poly3,nested_sine,trig_product,interaction \
            --scenarios complementary,spurious,exception \
            --noise 0.03,0.10 \
            --samples 300 \
            --clients 4 \
            --seeds 10001-10005 \
            --variants fedfalsify-full,fedfalsify-no-heterogeneity,fedfalsify-no-replacement,fedfalsify-no-nondegradation,score-only-federated,centralized-catalog,local-consensus,fedfalsify-no-exception-module \
            --max-terms 6 \
            --bootstrap-resamples 4000 \
            --output results/transactions_ablation_dev/rows.csv \
            --summary results/transactions_ablation_dev/summary_raw.json \
            --holm-summary results/transactions_ablation_dev/summary_holm.json
      - name: Validate development matrix
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("results/transactions_ablation_dev")
          with (root / "rows.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 1200
          assert {int(row["seed"]) for row in rows} == set(range(10001, 10006))
          assert not ({int(row["seed"]) for row in rows} & set(range(9001, 9021)))
          assert len({row["method"] for row in rows}) == 8
          identities = {
              (
                  row["benchmark"], row["scenario"], row["noise_ratio"],
                  row["samples_per_client"], row["num_clients"],
                  row["seed"], row["method"],
              )
              for row in rows
          }
          assert len(identities) == len(rows)
          summary = json.loads((root / "summary_holm.json").read_text(encoding="utf-8"))
          assert len(summary["methods"]) == 8
          assert summary["protocol"]["seed_policy"].startswith("fresh development")
          PY
      - name: Seal development ablation
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import subprocess

          root = Path("results/transactions_ablation_dev")

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          files = {
              path.relative_to(root).as_posix(): {
                  "bytes": path.stat().st_size,
                  "sha256": digest(path),
              }
              for path in sorted(root.rglob("*"))
              if path.is_file() and path.name != "manifest.json"
          }
          manifest = {
              "schema_version": 1,
              "status": "development-complete",
              "analysis": "Transactions controlled component ablations",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_git_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "rows": 1200,
              "seeds": list(range(10001, 10006)),
              "frozen_seed_overlap": [],
              "benchmarks": [
                  "base", "poly3", "nested_sine", "trig_product", "interaction"
              ],
              "scenarios": ["complementary", "spurious", "exception"],
              "noise_ratios": [0.03, 0.10],
              "samples_per_client": 300,
              "clients": 4,
              "files": files,
              "scientific_boundary": [
                  "Development evidence only.",
                  "May guide method design but cannot support final confirmatory claims.",
                  "Validation and final seeds remain untouched."
              ]
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY
      - name: Upload development ablation evidence
        uses: actions/upload-artifact@v4
        with:
          name: transactions-ablation-development
          path: results/transactions_ablation_dev
          if-no-files-found: error
          retention-days: 90
