name: transactions-parser-repair

on:
  push:
    branches: [feat/fedfalsify-transactions]
    paths:
      - .github/workflows/transactions_parser_repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fedfalsify-transactions
      - name: Patch Unicode indicator parser and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          analysis = Path("src/fedfalsify/transactions_analysis.py")
          text = analysis.read_text(encoding="utf-8")
          old = '''    text = re.sub(
              r"I\\s*\\(\\s*x3\\s*>\\s*1(?:\\.0+)?\\s*\\)",
              "indicator(x3)",
              text,
          )
          '''
          new = '''    text = re.sub(
              r"(?:I\\s*\\(\\s*x3\\s*>\\s*1(?:\\.0+)?\\s*\\)|𝟙\\s*\\[\\s*x3\\s*>\\s*1(?:\\.0+)?\\s*\\])",
              "indicator(x3)",
              text,
          )
          '''
          if old not in text:
              raise RuntimeError("expected parser block was not found")
          analysis.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_transactions_analysis.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "test_unicode_blackboard_indicator_notation"
          if marker not in test_text:
              test_text += '''\n\ndef test_unicode_blackboard_indicator_notation() -> None:\n    x = np.asarray(\n        [\n            [0.5, 0.25, 2.0, 0.0],\n            [-0.5, -0.25, 0.5, 0.0],\n        ]\n    )\n    prediction, normalized = evaluate_expression(\n        "0.75·𝟙[x₃>1]·x₃²", x\n    )\n    np.testing.assert_allclose(prediction, np.asarray([3.0, 0.0]))\n    assert normalized == "0.75*indicator(x3)*x3**2"\n'''
              tests.write_text(test_text, encoding="utf-8")

          workflow = Path(".github/workflows/tests.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          old_assert = '''          assert summary["methods"]["fedfalsify-v05"]["parse_failures"] == 0
          PY
      - name: Audited Colab dry run
          '''
          new_assert = '''          parse_failures = {
              method: values["parse_failures"]
              for method, values in summary["methods"].items()
          }
          print("Semantic parse failures:", parse_failures)
          assert all(value == 0 for value in parse_failures.values()), parse_failures
          PY
      - name: Transactions ablation smoke test
        run: |
          fedfalsify-transactions-ablation \\
            --smoke \\
            --bootstrap-resamples 200 \\
            --output results/transactions_ablation_smoke.csv \\
            --summary results/transactions_ablation_smoke_raw.json \\
            --holm-summary results/transactions_ablation_smoke_holm.json
          python - <<'PY'
          import csv
          from pathlib import Path

          with Path("results/transactions_ablation_smoke.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 14
          assert {int(row["seed"]) for row in rows} == {10001}
          PY
      - name: Audited Colab dry run
          '''
          if old_assert not in workflow_text:
              raise RuntimeError("expected semantic CI assertion block was not found")
          workflow.write_text(
              workflow_text.replace(old_assert, new_assert, 1),
              encoding="utf-8",
          )
          PY
      - name: Run focused tests
        run: |
          python -m pip install -e ".[dev]"
          pytest tests/test_transactions_analysis.py tests/test_transactions_ablation.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/fedfalsify/transactions_analysis.py \
            tests/test_transactions_analysis.py \
            .github/workflows/tests.yml
          if git diff --cached --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git commit -m "fix: parse Unicode exception indicators"
          git push origin "HEAD:feat/fedfalsify-transactions"
