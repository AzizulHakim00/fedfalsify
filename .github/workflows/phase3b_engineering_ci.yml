name: Phase 3B scientific implementation

on:
  push:
    branches:
      - research/phase3b-scientific-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,study]"
      - name: Verify frozen comparator files are unchanged
        run: |
          git diff --exit-code 78d0ab7ca7afb1edfa4725a45dfd20ce2db39659 -- \
            src/fedfalsify/scsv_v11.py \
            src/fedfalsify/scsv_v11_study.py \
            src/fedfalsify/scsv_v10_benchmarks.py
      - name: Verify frozen v11 comparator tests
        run: pytest -q tests/test_scsv_v11.py
      - name: Run Phase-3B Batch-A tests
        run: |
          pytest -q \
            tests/test_phase3_seed_firewall.py \
            tests/test_sufficient_stats.py \
            tests/test_linear_algebra.py \
            tests/test_nested_tests.py \
            tests/test_multiple_testing.py
      - name: Run Phase-3B Batch-B tests
        run: |
          pytest -q \
            tests/test_shared_recertification.py \
            tests/test_role_localization_v12.py \
            tests/test_localized_certification.py
      - name: Run full repository test suite
        run: pytest -q
