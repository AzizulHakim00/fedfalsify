name: HR-VFS v5 engineering smoke

on:
  push:
    branches:
      - feat/fedfalsify-mvi
    paths:
      - "src/fedfalsify/high_recall_v5.py"
      - "src/fedfalsify/high_recall_v5_study.py"
      - "tests/test_high_recall_v5.py"
      - "research/TRANSACTIONS_HIGH_RECALL_VERIFIED_FORWARD_V5_PROTOCOL.md"
      - ".github/workflows/high_recall_v5_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e "..[dev]" || python -m pip install -e ".[dev]"

      - name: Run v5 invariant tests
        run: pytest -q tests/test_high_recall_v5.py

      - name: Run engineering smoke only
        run: |
          rm -rf /tmp/hr_v5_smoke
          mkdir -p /tmp/hr_v5_smoke
          python -m fedfalsify.high_recall_v5_study --smoke \
            --output /tmp/hr_v5_smoke/rows.csv \
            --summary /tmp/hr_v5_smoke/summary.json

      - name: Audit smoke isolation
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          rows = list(csv.DictReader(Path('/tmp/hr_v5_smoke/rows.csv').open()))
          summary = json.loads(Path('/tmp/hr_v5_smoke/summary.json').read_text())
          assert len(rows) == 40, len(rows)
          assert {int(row['seed']) for row in rows} == {17001}
          assert {row['method'] for row in rows} == {
              'legacy-certificate', 'crossfit-v2-structural',
              'stability-superset-v3', 'role-v4-no-backward',
              'hr-v5-full', 'hr-v5-no-bundle-rescue',
              'hr-v5-no-score-proposer', 'hr-v5-no-role-conditioning',
              'centralized-forward', 'score-only-federated',
          }
          assert summary['development_gate']['evaluated'] is False
          assert summary['development_gate']['passed'] is None
          assert summary['seeds'] == [17001]
          print('v5 engineering smoke isolated from development evidence')
          PY
