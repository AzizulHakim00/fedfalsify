name: SCSV-RCD v7 fresh development evidence

on:
  push:
    branches:
      - feat/fedfalsify-mvi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scsv-rcd-v7-development
  cancel-in-progress: false

jobs:
  evidence:
    if: contains(github.event.head_commit.message, '[run-v7-development]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source pin
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify frozen v7 implementation and historical boundary
        run: |
          set -euo pipefail
          HIST=1d99c923dcc82ec909368ae528c40ecfbcf2006b
          test "$(git rev-parse "${HIST}:src/fedfalsify/scsv_v6.py")" = "$(git rev-parse "HEAD:src/fedfalsify/scsv_v6.py")"
          test "$(git rev-parse "${HIST}:results/rccd_spent_diagnostic/decision.json")" = "$(git rev-parse "HEAD:results/rccd_spent_diagnostic/decision.json")"
          grep -q '"status": "RCCD-MECHANISM-SIGNAL"' results/rccd_spent_diagnostic/decision.json
          grep -q '"status": "INDEPENDENT-NO-GO"' results/scsv_v6_independent/decision.json
          pytest -q tests/test_scsv_v7.py

      - name: Execute frozen 580-condition fresh v7 development matrix
        run: |
          rm -rf results/scsv_v7
          mkdir -p results/scsv_v7
          python -m fedfalsify.scsv_v7_study \
            --output results/scsv_v7/rows.csv \
            --summary results/scsv_v7/summary.json

      - name: Audit and seal v7 development evidence
        env:
          RUN_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import csv, hashlib, json, math, os
          from pathlib import Path

          root = Path("results/scsv_v7")
          rows_path = root / "rows.csv"
          summary_path = root / "summary.json"
          rows = list(csv.DictReader(rows_path.open(encoding="utf-8")))
          summary = json.loads(summary_path.read_text(encoding="utf-8"))

          methods = {
              "scsv-rcd-v7-full",
              "scsv-v6-full",
              "legacy-certificate",
              "centralized-forward",
              "scsv-rcd-v7-no-probe",
          }
          assert len(rows) == 580 * len(methods), len(rows)
          assert {row["method"] for row in rows} == methods
          assert {int(row["seed"]) for row in rows} == {24101, 24102, 24103, 24104, 24105}
          assert 24001 not in {int(row["seed"]) for row in rows}

          full = [row for row in rows if row["method"] == "scsv-rcd-v7-full"]
          assert len(full) == 580
          keys = {
              (
                  row["family"], f'{float(row["noise_ratio"]):.12g}',
                  int(row["samples_per_client"]), int(row["num_clients"]),
                  row["balance_profile"], row["role_profile"], int(row["seed"])
              )
              for row in full
          }
          assert len(keys) == 580, len(keys)
          assert summary["status"] == "scsv-rcd-v7-development"
          assert summary["conditions"] == 580
          gate = summary["development_gate"]
          assert gate["evaluated"] is True
          assert set(gate["criteria"]) == {
              "A_integrity_580_fresh_conditions",
              "B_shared_anchor_preserved",
              "C_null_spurious_deviation_le_005",
              "D_zero_exact_harms",
              "E_overall_exact_noninferior_001",
              "F_deviation_subset_exact_gain_ge_003",
              "G_deviation_precision_ge_095",
              "H_deviation_recall_ge_090",
              "I_each_family_recovery_ge_085",
              "J_four_client_recovery_ge_085",
              "K_eight_client_recovery_ge_090",
              "L_sixteen_client_recovery_ge_090",
              "M_imbalance_gap_le_008",
              "N_high_noise_recovery_ge_085",
              "O_dual_both_ge_075_and_no_spurious_in_exact",
              "P_certificate_integrity",
              "Q_communication_le_150pct_v6",
              "R_runtime_le_200pct_v6",
          }

          for row in rows:
              for field in (
                  "exact_recovery", "term_precision", "term_recall", "test_nmse",
                  "train_mse", "deviation_precision", "deviation_recall",
                  "all_true_deviations_recovered", "spurious_deviation_accepted",
                  "runtime_seconds", "communication_bytes",
              ):
                  assert math.isfinite(float(row[field])), (field, row)
          for row in full:
              anchor = {term for term in row["anchor_structure"].split(";") if term}
              final = {term for term in row["discovered_terms"].split(";") if term} | {"1"}
              assert anchor <= final
              assert int(float(row["certificate_violation_count"])) == 0

          decision = {
              "schema_version": 1,
              "status": "DEVELOPMENT-GO" if gate["passed"] else "DEVELOPMENT-NO-GO",
              "passed": bool(gate["passed"]),
              "criteria": gate["criteria"],
              "scientific_boundary": (
                  "A GO authorizes only a separately frozen independent v7 validation with a new untouched seed namespace. "
                  "A NO-GO permanently spends 24101--24105 and forbids retuning v7 on them."
              ),
          }
          (root / "decision.json").write_text(json.dumps(decision, indent=2, sort_keys=True), encoding="utf-8")

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          source_paths = [
              "research/TRANSACTIONS_SCSV_RCD_V7_PROTOCOL.md",
              "src/fedfalsify/scsv_v7.py",
              "src/fedfalsify/scsv_v7_benchmarks.py",
              "src/fedfalsify/scsv_v7_study.py",
              "src/fedfalsify/scsv_v6.py",
              "tests/test_scsv_v7.py",
              ".github/workflows/scsv_v7_development.yml",
          ]
          manifest = {
              "schema_version": 1,
              "run_mode": "fresh-scsv-rcd-v7-development",
              "run_commit": os.environ["RUN_COMMIT"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "fresh_development_seeds": [24101, 24102, 24103, 24104, 24105],
              "engineering_seed_used": [],
              "historical_rccd_seal_commit": "1d99c923dcc82ec909368ae528c40ecfbcf2006b",
              "historical_v6_independent_status": "INDEPENDENT-NO-GO",
              "rows": len(rows),
              "conditions": len(keys),
              "source_sha256": {path: digest(path) for path in source_paths},
              "output_sha256": {
                  "rows.csv": digest(rows_path),
                  "summary.json": digest(summary_path),
                  "decision.json": digest(root / "decision.json"),
              },
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8")
          (root / "COMPLETE").write_text("SCSV-RCD v7 development evidence sealed\n", encoding="utf-8")

          outputs = [rows_path, summary_path, root / "decision.json", root / "manifest.json"]
          with (root / "SHA256SUMS").open("w", encoding="utf-8") as handle:
              for path in outputs:
                  handle.write(f"{digest(path)}  {path.name}\n")
          print(json.dumps(decision, indent=2, sort_keys=True))
          PY

      - name: Upload sealed v7 evidence before repository write
        uses: actions/upload-artifact@v4
        with:
          name: scsv-rcd-v7-development-evidence
          path: results/scsv_v7
          if-no-files-found: error
          retention-days: 30

      - name: Commit sealed v7 development evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/scsv_v7
          git commit -m "results: seal SCSV-RCD v7 development evidence [skip ci]"
          git fetch origin feat/fedfalsify-mvi
          git rebase origin/feat/fedfalsify-mvi
          git push origin HEAD:feat/fedfalsify-mvi
