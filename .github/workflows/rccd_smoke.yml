name: RCCD spent-diagnostic engineering smoke

on:
  push:
    branches:
      - feat/fedfalsify-mvi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rccd-spent-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[run-rccd-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source pin
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify frozen v6 source and immutable independent reference
        run: |
          set -euo pipefail
          test "$(sha256sum src/fedfalsify/scsv_v6.py | cut -d' ' -f1)" = "f56a38da25a60752b5580e449a7213e88ef6d7a6006759272274331e5ff174fb"
          HISTORICAL_COMMIT=25fd323c54bfa49dfcd55f36f39d9f1305195eb8
          HISTORICAL_ROWS_BLOB="$(git rev-parse "${HISTORICAL_COMMIT}:results/scsv_v6_independent/rows.csv")"
          CURRENT_ROWS_BLOB="$(git rev-parse "HEAD:results/scsv_v6_independent/rows.csv")"
          test "${HISTORICAL_ROWS_BLOB}" = "92f25b499bc77499ad924e14d26feb95031b82f8"
          test "${CURRENT_ROWS_BLOB}" = "${HISTORICAL_ROWS_BLOB}"
          echo "RCCD frozen-source boundary PASS"

      - name: Run frozen RCCD invariant tests
        run: pytest -q tests/test_rccd_diagnostic.py

      - name: Run engineering smoke only
        run: |
          rm -rf results/rccd_smoke
          mkdir -p results/rccd_smoke
          python -m fedfalsify.rccd_spent_study \
            --smoke \
            --output results/rccd_smoke/rows.csv \
            --summary results/rccd_smoke/summary.json

      - name: Audit smoke isolation
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path

          root = Path("results/rccd_smoke")
          rows = list(csv.DictReader((root / "rows.csv").open(encoding="utf-8")))
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))

          assert len(rows) == 5, len(rows)
          assert {row["method"] for row in rows} == {"rccd-spent-diagnostic"}
          seeds = {int(row["seed"]) for row in rows}
          assert seeds == {23001}, seeds
          assert not ({20101, 20102, 20103, 20104, 20105} & seeds)
          assert 22001 not in seeds
          assert summary["status"] == "rccd-engineering-smoke"
          assert summary["mechanism_signal"]["evaluated"] is False
          assert summary["mechanism_signal"]["passed"] is None

          for row in rows:
              anchor = {term for term in row["frozen_v6_anchor_structure"].split(";") if term}
              final = {term for term in row["rccd_final_structure"].split(";") if term}
              assert anchor <= final
              assert len(final) <= 6
              if float(row["rccd_attempted"]):
                  assert float(row["source_in_anchor"]) == 1.0
                  assert row["source_term"]
                  for field in (
                      "exception_coefficient", "selector_full_sse", "selector_zero_sse",
                      "selector_delta", "probe_full_sse", "probe_zero_sse", "probe_delta",
                      "selector_outside_anchor_sse", "selector_outside_full_sse",
                      "probe_outside_anchor_sse", "probe_outside_full_sse",
                  ):
                      assert math.isfinite(float(row[field])), (field, row)
                  if float(row["rccd_accepted"]):
                      assert float(row["selector_passed"]) == 1.0
                      assert float(row["probe_passed"]) == 1.0
                      assert float(row["selector_delta"]) < 0.0
                      assert float(row["probe_delta"]) < 0.0
                      assert float(row["selector_outside_safe"]) == 1.0
                      assert float(row["probe_outside_safe"]) == 1.0
          print("RCCD smoke isolation PASS")
          PY

      - name: Upload engineering smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: rccd-engineering-smoke
          path: results/rccd_smoke
          if-no-files-found: error
          retention-days: 7
