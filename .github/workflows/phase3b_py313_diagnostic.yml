name: Phase 3B Python 3.13 diagnostic

on:
  push:
    branches:
      - research/phase3b-scientific-implementation
  workflow_dispatch:

jobs:
  py313-colab-versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Checkout pinned scientific source
        run: git checkout --detach b67a07371bcf244728536028593373ca7d1990b1
      - name: Install Colab-matched dependency versions
        run: |
          python -m pip install 'numpy==2.1.3' 'scipy==1.16.3' 'pandas==2.2.3' 'joblib==1.5.3' 'pytest>=8,<9'
          python -m pip install -e . --no-deps
          python - <<'PY'
          import sys, numpy, scipy, pandas, joblib, pytest
          print('python', sys.version)
          print('numpy', numpy.__version__)
          print('scipy', scipy.__version__)
          print('pandas', pandas.__version__)
          print('joblib', joblib.__version__)
          print('pytest', pytest.__version__)
          PY
      - name: Full pinned-source test gate under Colab-matched versions
        run: pytest -q
