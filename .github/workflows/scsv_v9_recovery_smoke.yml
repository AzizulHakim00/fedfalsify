name: SCSV-RCEF v9 sharded recovery engineering smoke

on:
  push:
    branches:
      - feat/fedfalsify-mvi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scsv-rcef-v9-recovery-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[run-v9-recovery-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact source pin
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify frozen scientific source and historical boundary
        run: |
          set -euo pipefail
          FROZEN_V9=f291f05f1c0f0916b4450e9dcc8bbec4322bb110
          V8_SEAL=a80477308f84c93e02108ff0e9528613f9561f90
          for path in \
            research/TRANSACTIONS_SCSV_RCEF_V9_PROTOCOL.md \
            src/fedfalsify/scsv_v9.py \
            src/fedfalsify/scsv_v9_benchmarks.py \
            src/fedfalsify/scsv_v9_study.py \
            tests/test_scsv_v9.py; do
            test "$(git rev-parse "${FROZEN_V9}:${path}")" = "$(git rev-parse "HEAD:${path}")"
          done
          test "$(git rev-parse "${V8_SEAL}:results/scsv_v8/decision.json")" = "$(git rev-parse "HEAD:results/scsv_v8/decision.json")"
          test "$(git rev-parse "${V8_SEAL}:results/scsv_v8/rows.csv")" = "$(git rev-parse "HEAD:results/scsv_v8/rows.csv")"
          grep -q 'INFRASTRUCTURE-CANCELLED / NO SCIENTIFIC VERDICT' research/TRANSACTIONS_SCSV_RCEF_V9_INFRASTRUCTURE_CANCELLATION.md
          grep -q '26101--26105' research/TRANSACTIONS_SCSV_RCEF_V9_INFRASTRUCTURE_CANCELLATION.md
          grep -q '"status": "DEVELOPMENT-NO-GO"' results/scsv_v8/decision.json
          grep -q '"status": "DEVELOPMENT-NO-GO"' results/scsv_v7/decision.json
          grep -q '"status": "INDEPENDENT-NO-GO"' results/scsv_v6_independent/decision.json

      - name: Run frozen v9 and recovery firewall tests
        run: pytest -q tests/test_scsv_v9.py tests/test_scsv_v9_recovery.py

      - name: Run recovery engineering smoke only
        run: |
          rm -rf results/scsv_v9_recovery_smoke
          python -m fedfalsify.scsv_v9_recovery smoke --out results/scsv_v9_recovery_smoke

      - name: Audit recovery smoke isolation
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path('results/scsv_v9_recovery_smoke')
          rows = list(csv.DictReader((root / 'rows-smoke.csv').open(encoding='utf-8')))
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          assert len(rows) == 8, len(rows)
          assert {int(row['seed']) for row in rows} == {27001}
          assert {row['method'] for row in rows} == {'scsv-rcef-v9-full'}
          forbidden = {26101,26102,26103,26104,26105,27101,27102,27103,27104,27105}
          assert not forbidden & {int(row['seed']) for row in rows}
          assert summary['conditions'] == 8
          assert summary['rows'] == 8
          assert summary['development_gate']['evaluated'] is False
          assert summary['development_gate']['passed'] is None
          print('SCSV-RCEF v9 recovery smoke isolation PASS')
          PY

      - name: Upload recovery engineering smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: scsv-rcef-v9-recovery-engineering-smoke
          path: results/scsv_v9_recovery_smoke
          if-no-files-found: error
          retention-days: 7
