name: external-beijing-prepare

on:
  push:
    branches: [feat/fedfalsify-mvi]
    paths:
      - .github/workflows/external_beijing_prepare.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-beijing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test leakage-safe loader
        run: pytest tests/test_external_beijing.py
      - name: Download and prepare official UCI archive
        run: |
          rm -rf data/external/beijing data/prepared/beijing
          mkdir -p data/external/beijing
          fedfalsify-external-beijing \
            --archive data/external/beijing/beijing_air_quality.zip \
            --download \
            --train-fraction 0.60 \
            --validation-fraction 0.20 \
            --min-usable-rows 1000 \
            --output-dir data/prepared/beijing \
            --manifest data/prepared/beijing/manifest.json
      - name: Validate external-data invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path("data/prepared/beijing")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["dataset"] == "UCI Beijing Multi-Site Air Quality"
          assert manifest["station_count"] == 12
          assert manifest["total_raw_rows"] == 420768
          assert len(manifest["archive_sha256"]) == 64
          assert manifest["license"] == "CC BY 4.0"
          assert manifest["split"]["type"] == "chronological within station"
          assert len(manifest["feature_names"]) == 27
          files = sorted(root.glob("*.npz"))
          assert len(files) == 12
          total_rows = 0
          for path in files:
              data = np.load(path)
              assert data["train_x"].shape[1] == 27
              assert data["validation_x"].shape[1] == 27
              assert data["test_x"].shape[1] == 27
              assert np.all(np.isfinite(data["train_x"]))
              assert np.all(np.isfinite(data["validation_x"]))
              assert np.all(np.isfinite(data["test_x"]))
              assert str(data["train_timestamps"][-1]) < str(data["validation_timestamps"][0])
              assert str(data["validation_timestamps"][-1]) < str(data["test_timestamps"][0])
              total_rows += (
                  len(data["train_y"])
                  + len(data["validation_y"])
                  + len(data["test_y"])
              )
          assert total_rows == manifest["total_prepared_rows"]
          assert total_rows + manifest["total_dropped_missing_target"] == 420768
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Upload preparation manifest
        uses: actions/upload-artifact@v4
        with:
          name: external-beijing-manifest
          path: data/prepared/beijing/manifest.json
          if-no-files-found: error
          retention-days: 90
