name: Phase 3A shadow-refactor parity

on:
  push:
    branches:
      - research/phase3a-shadow-refactor-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen v11 comparator tests
        run: pytest -q tests/test_scsv_v11.py
      - name: Run Phase-3A tests that exist in this commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( \
            -name 'test_phase3a_*.py' -o \
            -name 'test_sufficient_stats.py' -o \
            -name 'test_linear_algebra.py' -o \
            -name 'test_phase3_cache.py' \
          \) | sort)
          if ((${#files[@]})); then
            pytest -q "${files[@]}"
          else
            echo "No Phase-3A-specific tests present yet."
          fi
