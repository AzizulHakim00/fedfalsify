name: Phase 3C fresh-development harness

on:
  push:
    branches:
      - research/phase3c-fresh-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,study]"
      - name: Verify frozen comparator files are unchanged
        run: |
          git diff --exit-code 78d0ab7ca7afb1edfa4725a45dfd20ce2db39659 -- \
            src/fedfalsify/scsv_v11.py \
            src/fedfalsify/scsv_v11_study.py \
            src/fedfalsify/scsv_v10_benchmarks.py
      - name: Verify frozen Phase-3 scientific files are unchanged
        run: |
          git diff --exit-code b67a07371bcf244728536028593373ca7d1990b1 -- \
            src/fedfalsify/scsv_v12.py \
            src/fedfalsify/shared_recertification.py \
            src/fedfalsify/role_localization_v12.py \
            src/fedfalsify/localized_certification.py \
            src/fedfalsify/nested_tests.py \
            src/fedfalsify/multiple_testing.py \
            src/fedfalsify/sufficient_stats.py \
            src/fedfalsify/linear_algebra.py \
            src/fedfalsify/legacy_v11_adapter.py
      - name: Run Phase-3C focused tests
        run: pytest -q tests/test_phase3_development_runner.py
      - name: Run full repository test suite
        run: pytest -q
