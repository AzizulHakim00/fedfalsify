name: transactions-pysr-validation

on:
  pull_request:
    paths:
      - src/fedfalsify/transactions_pysr_validation.py
      - src/fedfalsify/transactions_pysr.py
      - src/fedfalsify/pysr_adapter.py
      - tests/test_transactions_pysr_validation.py
      - tests/test_transactions_pysr.py
      - research/TRANSACTIONS_PYSR_VALIDATION_PROTOCOL.md
      - pyproject.toml
      - .github/workflows/transactions_pysr_validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-seed:
    name: validation-seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [10501, 10502, 10503, 10504, 10505]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Install official PySR and test dependencies
        run: python -m pip install -e ".[dev,sr]"
      - name: Validate runner governance
        run: |
          pytest \
            tests/test_transactions_pysr.py \
            tests/test_transactions_pysr_validation.py
      - name: Record environment
        run: |
          python - <<'PY'
          import platform
          import pysr
          print("Python:", platform.python_version())
          print("PySR:", pysr.__version__)
          PY
          julia --version
      - name: Unmeasured Julia and PySR warm-up
        run: |
          mkdir -p /tmp/fedfalsify-pysr-warmup
          fedfalsify-pysr \
            --benchmark base \
            --scenarios complementary \
            --seed 10499 \
            --smoke \
            --output /tmp/fedfalsify-pysr-warmup/rows.csv
      - name: Run preregistered matched validation seed
        run: |
          root="results/transactions_pysr_validation/seed-${{ matrix.seed }}"
          rm -rf "$root"
          mkdir -p "$root"
          fedfalsify-transactions-pysr-validation run-seed \
            --seed "${{ matrix.seed }}" \
            --benchmarks base,poly3,nested_sine,trig_product,interaction \
            --scenarios complementary,spurious \
            --noise 0.03,0.10 \
            --samples 300 \
            --clients 4 \
            --regimes compact,quality \
            --output "$root/rows.csv" \
            --manifest "$root/environment.json"
      - name: Validate seed evidence
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          seed = ${{ matrix.seed }}
          root = Path(f"results/transactions_pysr_validation/seed-{seed}")
          with (root / "rows.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 80
          assert {int(row["seed"]) for row in rows} == {seed}
          assert {row["regime"] for row in rows} == {"compact", "quality"}
          assert {row["method"] for row in rows} == {
              "fedfalsify-v05", "official-pysr"
          }
          assert len({
              (
                  row["benchmark"], row["scenario"], row["noise_ratio"],
                  row["seed"], row["regime"], row["method"],
              )
              for row in rows
          }) == 80
          pysr_rows = [row for row in rows if row["method"] == "official-pysr"]
          assert len(pysr_rows) == 40
          assert all(row["grammar_supported"] == "True" for row in pysr_rows)
          assert all(row["completed"] == "True" for row in pysr_rows)
          manifest = json.loads((root / "environment.json").read_text(encoding="utf-8"))
          assert manifest["seed"] == seed
          assert manifest["status"] == "seed-complete"
          assert manifest["pysr"] != "unavailable"
          assert manifest["julia"] != "unavailable"
          PY
      - name: Upload seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: pysr-validation-seed-${{ matrix.seed }}
          path: results/transactions_pysr_validation/seed-${{ matrix.seed }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-validation
    runs-on: ubuntu-latest
    needs: run-seed
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: pysr-validation-seed-*
          path: artifacts
      - name: Aggregate paired validation
        run: |
          rm -rf results/transactions_pysr_validation/final
          mkdir -p results/transactions_pysr_validation/final
          mapfile -t files < <(find artifacts -type f -name rows.csv | sort)
          test "${#files[@]}" -eq 5
          fedfalsify-transactions-pysr-validation aggregate \
            --inputs "${files[@]}" \
            --output results/transactions_pysr_validation/final/rows.csv \
            --summary results/transactions_pysr_validation/final/summary.json
          mkdir -p results/transactions_pysr_validation/final/environments
          find artifacts -type f -name environment.json -print0 \
            | sort -z \
            | xargs -0 -I{} cp "{}" results/transactions_pysr_validation/final/environments/
      - name: Validate complete frozen matrix
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("results/transactions_pysr_validation/final")
          with (root / "rows.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 400
          assert {int(row["seed"]) for row in rows} == set(range(10501, 10506))
          assert not ({int(row["seed"]) for row in rows} & set(range(9001, 9021)))
          assert all(int(row["seed"]) < 11001 for row in rows)
          assert {row["benchmark"] for row in rows} == {
              "base", "poly3", "nested_sine", "trig_product", "interaction"
          }
          assert {row["scenario"] for row in rows} == {
              "complementary", "spurious"
          }
          assert {float(row["noise_ratio"]) for row in rows} == {0.03, 0.10}
          assert {row["regime"] for row in rows} == {"compact", "quality"}
          assert {row["method"] for row in rows} == {
              "fedfalsify-v05", "official-pysr"
          }
          assert len({
              (
                  row["benchmark"], row["scenario"], row["noise_ratio"],
                  row["samples_per_client"], row["num_clients"], row["seed"],
                  row["regime"], row["method"],
              )
              for row in rows
          }) == 400
          pysr_rows = [row for row in rows if row["method"] == "official-pysr"]
          assert len(pysr_rows) == 200
          assert all(row["completed"] == "True" for row in pysr_rows)

          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          assert summary["status"] == "validation"
          assert summary["rows"] == 400
          assert summary["pairs"] == 200
          assert summary["seeds"] == list(range(10501, 10506))
          assert summary["primary_endpoint"].startswith("quality-regime")
          assert summary["paired"]["quality"]["pairs"] == 100
          assert summary["paired"]["compact"]["pairs"] == 100
          assert summary["protocol"]["final_confirmation_start"] == 11001
          PY
      - name: Seal validation evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import subprocess

          root = Path("results/transactions_pysr_validation/final")

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          files = {
              path.relative_to(root).as_posix(): {
                  "bytes": path.stat().st_size,
                  "sha256": digest(path),
              }
              for path in sorted(root.rglob("*"))
              if path.is_file() and path.name != "manifest.json"
          }
          manifest = {
              "schema_version": 1,
              "status": "validation-complete",
              "study": "Matched FedFalsify versus official PySR validation",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "source_git_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "rows": 400,
              "matched_pairs": 200,
              "seeds": list(range(10501, 10506)),
              "final_confirmation_seeds_touched": False,
              "primary_endpoint": "quality all-domain semantic recovery at 1e-3",
              "files": files,
              "scientific_boundary": [
                  "Validation evidence, not final confirmation.",
                  "PySR pools raw observations; FedFalsify does not.",
                  "Exception scenarios are outside the shared grammar.",
                  "Seeds 11001 and above remain untouched."
              ],
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY
      - name: Upload complete validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: transactions-pysr-validation-final
          path: results/transactions_pysr_validation/final
          if-no-files-found: error
          retention-days: 90
